apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: food-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/restaurant-service:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: food-demo
spec:
  type: ClusterIP
  selector:
    app: restaurant-service
  ports:
    - port: 80
      targetPort: 8080
